<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Comunidade • KANEKI STORE</title><style>
:root{color-scheme:dark;font-family:Inter,system-ui,Arial;background:#0b0815;color:#f4efff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0%,#36165e 0%,#0b0815 55%)}button,input{font:inherit}button{cursor:pointer;border:0;background:#7c3aed;color:white;border-radius:12px;padding:11px 15px;font-weight:700}button:hover{filter:brightness(1.15)}button:disabled{opacity:.45;cursor:not-allowed}input{width:100%;background:#181126;border:1px solid #43305e;border-radius:12px;padding:12px;color:#fff}h1,h2,h3,p{margin:0}small,.muted{color:#b7a9cf}.shell{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100vh}.sidebar{background:#100b1d;border-right:1px solid #322448;padding:20px;display:flex;flex-direction:column;gap:16px}.brand{font-size:21px;font-weight:900;letter-spacing:.3px}.brand span{color:#c991ff}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions button{font-size:12px;padding:10px 5px}.rooms{display:grid;gap:7px;overflow:auto}.room{display:block;width:100%;text-align:left;background:#1c1430;border:1px solid #3b2b54}.room.active{background:#42246e;border-color:#ac7eff}.main{display:flex;flex-direction:column;min-height:100vh;min-width:0}.top{padding:20px 24px;border-bottom:1px solid #322448;display:flex;align-items:center;justify-content:space-between;gap:12px}.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border-radius:99px;background:#251739;color:#d9c1ff;font-size:12px}.chat{flex:1;overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:12px;min-height:250px;max-height:calc(100vh - 206px)}.message{background:#1b1329;border:1px solid #302142;border-radius:15px;padding:11px 14px;max-width:80%;overflow-wrap:anywhere;align-self:flex-start}.message.mine{align-self:flex-end;background:#362055;border-color:#654393}.message small{display:block;margin-bottom:6px}.composer{display:flex;gap:10px;padding:16px;border-top:1px solid #322448}.composer input{flex:1}.voice{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 18px;border-top:1px solid #322448;background:#140d22}.voice button{padding:9px 13px}.voice .end{background:#a92b4b}.empty{margin:auto;color:#b5a8c8;text-align:center;line-height:1.7}.dialog{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:15px;z-index:10}.dialog.show{display:flex}.panel{width:min(420px,100%);padding:25px;background:#1a102a;border:1px solid #6b3ca0;border-radius:20px;display:grid;gap:14px;box-shadow:0 25px 100px #000a}.panel .actions{grid-template-columns:1fr 1fr}.notice{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:#34214b;padding:12px 18px;border-radius:12px;display:none;max-width:95vw;z-index:15}.notice.show{display:block}.public-tag{font-size:11px;color:#baa0d6;float:right}@media(max-width:650px){.shell{grid-template-columns:1fr}.sidebar{padding:13px;border-right:0;border-bottom:1px solid #322448}.rooms{display:flex;max-width:100%;overflow:auto}.room{min-width:145px}.top{padding:12px}.chat{max-height:none;min-height:38vh}.message{max-width:95%}.main{min-height:65vh}.brand{font-size:18px}}
</style></head><body><div class="shell"><aside class="sidebar"><div class="brand">🔥 KANEKI <span>CHAT</span></div><small>Salas públicas e privadas com código</small><div class="actions"><button id="create">+ Criar sala</button><button id="join">⌗ Entrar código</button></div><h3>🌐 Salas</h3><div class="rooms" id="rooms"></div><small id="account">Verificando sua conta...</small></aside><main class="main"><div class="top"><div><h2 id="room-title">Escolha uma sala</h2><small id="room-sub">Converse com a comunidade</small></div><button id="copy" disabled>Copiar código</button></div><section class="chat" id="messages"><div class="empty">💬<p>Entre em uma sala para conversar.</p></div></section><div class="voice"><span class="pill" id="voice-status">🎙️ Fora da chamada</span><button id="call" disabled>Entrar na call</button><button id="mute" disabled>Silenciar</button><span class="muted" id="people"></span></div><form class="composer" id="form"><input id="message" maxlength="1500" placeholder="Escreva uma mensagem..." disabled autocomplete="off"><button id="send" disabled>Enviar ➤</button></form></main></div>
<div class="dialog" id="dialog"><form class="panel" id="dialog-form"><h2 id="dialog-title"></h2><input id="dialog-input" maxlength="60" required><label id="visibility-row"><input id="visibility" type="checkbox" checked style="width:auto"> Sala pública (aparece na lista)</label><div class="actions"><button type="button" id="cancel" style="background:#463455">Cancelar</button><button type="submit">Confirmar</button></div></form></div><div class="notice" id="notice"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/chat.js"></script></body></html>
